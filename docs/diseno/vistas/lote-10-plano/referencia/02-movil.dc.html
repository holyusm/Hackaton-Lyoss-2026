<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plano de Casa Central, móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443D0}a:hover{color:#182F9E}
.pm button{font-family:inherit}
.pm button:focus-visible,.pm input:focus-visible,.pm .pm-mapa:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
</style>
</helmet>
<div class="pm" style="{{vars}}; position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--mapafondo); color: var(--tinta); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif">

  <div class="pm-mapa" tabindex="0" role="application" aria-label="Plano de Casa Central. Arrastra para mover. La lista de edificios tiene la misma información." onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" style="position: absolute; inset: 0; touch-action: none">
    <svg width="390" height="844" aria-hidden="true" style="display: block">
      <g transform="{{tr}}">
        <sc-for list="{{calles}}" as="c" hint-placeholder-count="0">
          <path d="{{c.d}}" fill="none" stroke="{{p.calleBorde}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
        </sc-for>
        <sc-for list="{{calles}}" as="c" hint-placeholder-count="0">
          <path d="{{c.d}}" fill="none" stroke="{{p.calle}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
        </sc-for>
        <path d="{{d.vecinos}}" fill="{{p.vecino}}" stroke="{{p.vecinoBorde}}" stroke-width="0.6" vector-effect="non-scaling-stroke"></path>
        <path d="{{d.campus}}" fill="{{p.campus}}" stroke="{{p.campusBorde}}" stroke-width="2" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"></path>
        <sc-for list="{{d.patios}}" as="pt" hint-placeholder-count="0">
          <path d="{{pt.d}}" fill="{{p.patio}}" stroke="{{p.campusBorde}}" stroke-width="1" vector-effect="non-scaling-stroke"></path>
        </sc-for>
        <path d="{{d.senderos}}" fill="none" stroke="{{p.sendero}}" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        <sc-for list="{{edificios}}" as="e" hint-placeholder-count="0">
          <path d="{{e.d}}" fill="{{e.fill}}" stroke="{{e.stroke}}" stroke-width="{{e.sw}}" stroke-linejoin="round" vector-effect="non-scaling-stroke" onClick="{{e.pick}}" style="cursor: pointer"></path>
        </sc-for>
        <path d="{{d.escaleras}}" fill="none" stroke="{{p.halo}}" stroke-width="8" vector-effect="non-scaling-stroke"></path>
        <path d="{{d.escaleras}}" fill="none" stroke="{{p.escalera}}" stroke-width="6" stroke-dasharray="2 2.5" vector-effect="non-scaling-stroke"></path>
        <sc-for list="{{letras}}" as="l" hint-placeholder-count="0">
          <text x="{{l.x}}" y="{{l.y}}" font-size="{{l.fs}}" text-anchor="middle" dominant-baseline="central" fill="{{l.color}}" stroke="{{p.halo}}" stroke-width="{{l.halo}}" paint-order="stroke" font-weight="800">{{l.n}}</text>
        </sc-for>
        <g transform="{{aqui}}">
          <circle r="20" fill="#2443D0" fill-opacity="0.18"></circle>
          <circle r="8" fill="#2443D0" stroke="#FFFFFF" stroke-width="3"></circle>
        </g>
      </g>
    </svg>
  </div>

  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px">
    <label for="buscar-m" style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: var(--sup); box-shadow: 0 1px 0 rgba(13,43,62,0.06), 0 12px 32px rgba(13,43,62,0.14)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar edificio</span>
      <input id="buscar-m" type="search" placeholder="Buscar edificio o sala" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--tinta); font: inherit; font-size: 17px">
    </label>
  </div>

  <div style="position: absolute; top: 84px; right: 16px; display: flex; flex-direction: column; border-radius: 12px; background: var(--sup); box-shadow: 0 1px 0 rgba(13,43,62,0.06), 0 12px 32px rgba(13,43,62,0.14); overflow: hidden">
    <button type="button" onClick="{{acercar}}" aria-label="Acercar" style="width: 48px; height: 48px; border: 0; background: transparent; color: var(--tinta); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <div style="height: 1px; background: var(--linea)"></div>
    <button type="button" onClick="{{alejar}}" aria-label="Alejar" style="width: 48px; height: 48px; border: 0; background: transparent; color: var(--tinta); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
  </div>

  <section aria-label="Edificio seleccionado" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 10px 20px 24px; border-radius: 22px 22px 0 0; background: var(--sup); box-shadow: 0 -8px 32px rgba(13,43,62,0.18)">
    <div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: var(--linea)"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: #2443D0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">{{sel.letra}}</span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">{{sel.titulo}}</h1>
        <p style="margin: 0; font-size: 15px; color: var(--tinta2)">{{sel.sub}}</p>
      </div>
    </div>
    <div role="group" aria-label="Elegir piso" style="display: flex; gap: 8px">
      <sc-for list="{{sel.pisos}}" as="ps" hint-placeholder-count="3">
        <button type="button" onClick="{{ps.pick}}" aria-pressed="{{ps.on}}" style="{{ps.estilo}}; flex: 1 1 0; height: 44px; border-radius: 999px; font-size: 16px; font-weight: 600">{{ps.n}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--tinta2)">{{sel.nota}}</p>
    <div style="display: flex; gap: 8px">
      <button type="button" onClick="{{siguiente}}" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--borde); background: transparent; color: var(--tinta); font-size: 16px; font-weight: 600">Otro edificio</button>
      <a href="#" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 12px; background: #2443D0; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; box-shadow: 0 3px 0 #182F9E">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"></path></svg>
        Cómo llegar
      </a>
    </div>
    <p style="margin: 0; font-size: 12px; color: var(--tinta2); text-align: center">Datos © colaboradores de OpenStreetMap (ODbL)</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"oscuro":{"editor":"boolean","default":false,"section":"Tema"},"$preview":{"width":390,"height":844}}'>
var DATOS = '/_blob/07ec10631fb4a461d289730d149a6d17';
var MW = 390, MH = 520, DW = 653, DH = 479;
var S0 = Math.min(MW / DW, MH / DH);
var CLARO = { mapafondo: '#E2E8E7', campus: '#EEF2F1', campusBorde: '#9FB0B5', vecino: '#D0D8DA', vecinoBorde: '#B7C3C6', calle: '#F5F7F6', calleBorde: '#C9D3D6', patio: '#F5F7F6', edif: '#FCFDFD', edifBorde: '#3E5566', sel: '#E3E8FB', selBorde: '#2443D0', tinta: '#0D2B3E', tinta2: '#3E5566', halo: '#FCFDFD', sendero: '#6E848C', escalera: '#0D2B3E', sala: '#FCFDFD', salaBano: '#CDEBDF', sup: '#FCFDFD', linea: '#C9D3D6', borde: '#3E5566', foco: '#2443D0' };
var OSCURO = { mapafondo: '#0F2433', campus: '#132D3F', campusBorde: '#3A5A6E', vecino: '#1A3446', vecinoBorde: '#2A4A5E', calle: '#1C3A4F', calleBorde: '#24404F', patio: '#18354A', edif: '#2A4A5E', edifBorde: '#A9BBC5', sel: '#1E3366', selBorde: '#8FA5FF', tinta: '#E8EFF1', tinta2: '#A9BBC5', halo: '#0F2433', sendero: '#7F99A8', escalera: '#E8EFF1', sala: '#22416F', salaBano: '#1F5A48', sup: '#11293A', linea: '#24404F', borde: '#A9BBC5', foco: '#8FA5FF' };
var ORDEN = ['U', 'A', 'C', 'B', 'D', 'F', 'K', 'M'];
var EXTRA = { 'relation-17542343': { letra: 'B', sub: 'Edificio central · nombre por confirmar' } };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: null, letra: 'U', piso: 1, z: 2.2, cx: 306, cy: 200, drag: null };
  }
  componentDidMount() {
    var self = this;
    fetch(DATOS).then(function (r) { return r.json(); }).then(function (d) { self.setState({ d: d }); });
  }
  edif(letra) {
    var d = this.state.d, best = null;
    if (!d) return null;
    d.edificios.forEach(function (e) {
      var l = (EXTRA[e.id] || {}).letra || e.letra;
      if (l === letra && (!best || e.area > best.area)) best = e;
    });
    return best;
  }
  ir(letra) {
    var e = this.edif(letra); if (!e) return;
    this.setState({ letra: letra, piso: letra === 'C' ? 2 : 1, z: letra === 'C' ? 2.6 : 2.4, cx: e.x, cy: e.y + 40 });
  }
  renderVals() {
    var self = this, st = this.state, d = st.d;
    var p = this.props.oscuro ? OSCURO : CLARO;
    var vars = Object.keys(p).map(function (k) { return '--' + k + ': ' + p[k]; }).join('; ');
    var s = S0 * st.z, tx = MW / 2 - st.cx * s, ty = 40 + MH / 2 - st.cy * s;
    var e0 = this.edif(st.letra);
    var edificios = d ? d.edificios.map(function (e) {
      var l = (EXTRA[e.id] || {}).letra || e.letra;
      var on = l === st.letra;
      return { d: e.d, fill: on ? p.sel : p.edif, stroke: on ? p.selBorde : p.edifBorde, sw: on ? 3 : 1.25, pick: function () { if (l) self.ir(l); } };
    }) : [];
    var vistas = {};
    var letras = d ? d.edificios.filter(function (e) {
      var l = (EXTRA[e.id] || {}).letra || e.letra; if (!l || vistas[l]) return false;
      var big = self.edif(l); if (big !== e) return false; vistas[l] = true; return true;
    }).map(function (e) {
      var l = (EXTRA[e.id] || {}).letra || e.letra, on = l === st.letra;
      return { n: l, x: e.x, y: e.y, fs: +((on ? 22 : 16) / s).toFixed(2), halo: +(4 / s).toFixed(2), color: on ? p.selBorde : p.tinta };
    }) : [];
    var nombre = e0 ? (e0.nombre || 'Edificio ' + st.letra).split(' - ') : ['Edificio ' + st.letra];
    var pisos = st.letra === 'C' ? [-1, 1, 2] : (e0 && e0.pisos ? Array.from({ length: Math.min(e0.pisos, 5) }, function (_, i) { return i + 1; }) : [1]);
    var sel = {
      letra: st.letra, titulo: 'Edificio ' + st.letra,
      sub: (EXTRA[e0 && e0.id] || {}).sub || nombre[1] || (e0 && e0.pisos ? e0.pisos + ' pisos' : 'Pisos por confirmar'),
      pisos: pisos.map(function (n) { var on = n === st.piso; return { n: n === -1 ? '−1' : 'Piso ' + n, on: on ? 'true' : 'false', estilo: on ? 'background: ' + p.tinta + '; color: ' + p.halo + '; border: 2px solid ' + p.tinta : 'background: transparent; color: ' + p.tinta + '; border: 2px solid ' + p.borde, pick: function () { self.setState({ piso: n }); } }; }),
      nota: st.letra === 'C' && st.piso === 2 ? 'Piso 2 con plano interior (OpenStreetMap). Acceso sin escalones, ascensor y baño accesible: por levantar en terreno.' : 'Acceso sin escalones, ascensor y baño accesible: por levantar en terreno.'
    };
    var zoomA = function (z) { self.setState({ z: Math.max(1, Math.min(6, z)) }); };
    return {
      vars: vars, p: p, d: d || { vecinos: '', campus: '', patios: [], senderos: '', escaleras: '' },
      tr: 'translate(' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ') scale(' + s.toFixed(4) + ')',
      calles: d ? d.calles : [], edificios: edificios, letras: letras, sel: sel,
      aqui: 'translate(289 68) scale(' + (1 / s).toFixed(3) + ')',
      acercar: function () { zoomA(st.z * 1.4); }, alejar: function () { zoomA(st.z / 1.4); },
      siguiente: function () { var i = ORDEN.indexOf(st.letra); self.ir(ORDEN[(i + 1) % ORDEN.length]); },
      onDown: function (e) { self.setState({ drag: { x: e.clientX, y: e.clientY, cx: st.cx, cy: st.cy } }); },
      onMove: function (e) { var g = self.state.drag; if (!g) return; var dx = e.clientX - g.x, dy = e.clientY - g.y; if (Math.abs(dx) + Math.abs(dy) < 4) return; self.setState({ cx: g.cx - dx / s, cy: g.cy - dy / s }); },
      onUp: function () { if (self.state.drag) self.setState({ drag: null }); }
    };
  }
}
</script>
</body>
</html>
