# Despliega en Render cada push a main, solo si las pruebas pasan.
# Necesita el secreto RENDER_DEPLOY_HOOK (Render → servicio → Settings → Deploy Hook).
# Sin el secreto, el job pasa sin desplegar.
name: Deploy a Render
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Avisar a Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Falta el secreto RENDER_DEPLOY_HOOK: no se despliega."; exit 0; fi
          # ref = el commit que acaba de pasar las pruebas (idea de @juaquo15 en #71).
          curl -fsS -X POST --url-query "ref=$GITHUB_SHA" "$HOOK" > /dev/null
          echo "Deploy pedido a Render para $GITHUB_SHA."
